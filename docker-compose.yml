services:
  postgres:
    image: postgres:15
    container_name: test-constructor-db
    environment:
      POSTGRES_DB: test_constructor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - test-constructor-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: test-constructor-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/test_constructor
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-in-production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - test-constructor-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: test-constructor-frontend
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - test-constructor-network

volumes:
  postgres_data:

networks:
  test-constructor-network:
    driver: bridge
